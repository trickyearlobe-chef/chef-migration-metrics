# =============================================================================
# Chef Migration Metrics — Docker Compose (PostgreSQL for Local Development)
# =============================================================================
# Starts a PostgreSQL database for local development and testing.
# The application runs on the host via `make run` or `make dev`.
#
# Quick start:
#   cp .env.example .env    # set POSTGRES_PASSWORD
#   docker compose up -d
#   make run                # start the app on the host
#
# See README.md for full instructions.
# =============================================================================

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    command: ["-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chef_migration_metrics}
      POSTGRES_USER: ${POSTGRES_USER:-chef_migration_metrics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-chef_migration_metrics} -d ${POSTGRES_DB:-chef_migration_metrics}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # SQL Server, for developing and demonstrating the database ownership ingest.
  # Opt-in: it is not part of the default stack.
  #
  #   docker compose --profile mssql up -d mssql
  #   make seed-mssql
  #
  # No arm64 image exists, so it runs under emulation on Apple Silicon. It is
  # slower to start but works. If that becomes tiresome, a permanent Linux VM in
  # the Proxmox lab is the better home for it (MVP2).
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    profiles: ["mssql"]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # A local development credential, deliberately not a secret. Never point
      # this compose file at anything real.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Cmm_Dev_Password_2026!}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
    driver: local
  mssqldata:
    driver: local
