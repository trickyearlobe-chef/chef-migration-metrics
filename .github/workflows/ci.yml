# =============================================================================
# CI — Lint and Test (Pull Request Quality Gate)
# =============================================================================
# Runs on pull requests targeting main. Provides a confidence check before
# merging. Builds and releases are handled by the Release workflow when a
# version tag is pushed.
# =============================================================================

name: CI

on:
  pull_request:
    branches:
      - main
  # Also run on direct pushes to main so local --no-ff merges (which skip the PR
  # gate) cannot land unlinted/untested code — releases are cut from main, so the
  # gate must run there too.
  push:
    branches:
      - main

# Cancel in-progress runs for the same ref to save resources
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # journey-suite-check diffs against the base of the push or PR, so it
          # needs more than the tip commit.
          fetch-depth: 0

      # A journey with no suite states what is left in prose, and prose drifts —
      # that is how the convention got down to one journey in twenty before
      # anybody measured it. The pre-commit hook enforces this too; this is the
      # backstop for `git commit --no-verify`.
      #
      # Scoped to journeys CHANGED here on purpose. A repo-wide check would be
      # red the day it landed and disabled the week after.
      - name: Journeys changed here must have a suite
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$base" in
            ""|0000000000000000000000000000000000000000) base=HEAD~1 ;;
          esac
          make journey-suite-check BASE="$base"

      # The repo-wide half, made survivable by grandfathering what was already
      # here. It checks only that a suite EXISTS — never that it passes. Red is
      # the provable backlog and must never block a release, which is why
      # `make journey` stays out of `make ci`.
      #
      # Fails in both directions, so filling one gap while opening another
      # cannot net to zero, and a journey that gains a suite has to be struck
      # off the list before the build goes green again.
      - name: Journey suite ratchet
        run: make journey-ratchet

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Create placeholder frontend dist (for go:embed)
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html><head><title>placeholder</title></head><body></body></html>' > frontend/dist/index.html

      - name: Install and run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./...

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  # ---------------------------------------------------------------------------
  # Test
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Create placeholder frontend dist (for go:embed)
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html><head><title>placeholder</title></head><body></body></html>' > frontend/dist/index.html

      - name: Run Go tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm ci
          # Coverage needs @vitest/coverage-v8, which is not yet a dependency.
          # Run without --coverage until it is added (see plans/active.md).
          npm test

  # ---------------------------------------------------------------------------
  # Security Scan — tiered supply-chain policy
  #
  # Tier 1 (hard fail, blocks the PR): reachable Go vulns at any severity +
  #   npm production-dependency HIGH/CRITICAL.
  # Tier 2 (report only, surfaced in the Security tab, never blocks): full Trivy
  #   incl. dev deps + LOW + secrets + misconfig, osv-scanner, behavioural scan.
  # KEV/EPSS-aware prioritisation is handled by Dependabot (.github/dependabot.yml
  #   + repo settings), not by these gates.
  #
  # This job scans the LOCKFILE and never runs `npm ci`, so a compromised
  # dependency's install hook cannot execute on the runner. Third-party actions
  # are pinned to immutable commit SHAs (Dependabot github-actions keeps them
  # current).
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the code-scanning / Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Create placeholder frontend dist (for go:embed)
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html><head><title>placeholder</title></head><body></body></html>' > frontend/dist/index.html

      # --- Tier 1: hard fail ------------------------------------------------

      # Go: reachable (call-graph) vulnerabilities at ANY severity. Reachability
      # is the real risk signal, so this gate is strict and cheap.
      - name: govulncheck (Go reachable — blocking)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/package.json
          # No `cache: npm` / `npm ci` — we scan the lockfile, never install.

      # npm production deps: HIGH/CRITICAL always block. Dev deps are excluded by
      # Trivy's default (they are not shipped).
      #
      # Every Trivy step below carries timeout-minutes for one reason: Trivy's
      # vulnerability-DB download can stall indefinitely (the registry accepts
      # the connection and then sends nothing) and neither Trivy's own --timeout
      # nor its second-registry fallback ends that stall. See the long note above
      # _trivy-db in the Makefile for the measurements. Without this the step
      # would sit on the runner until the 6-hour job limit. A normal run,
      # download included, is well under a minute.
      - name: Trivy — npm production deps, HIGH/CRITICAL (blocking)
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend/package-lock.json
          scanners: vuln
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      # MEDIUM gate — the agreed target, now BLOCKING. The pending fixable
      # mediums that kept this staged have landed (react-router@6.30.4,
      # brace-expansion@5.0.6), so MEDIUM npm production vulns now fail the PR.
      - name: Trivy — npm production deps, MEDIUM (blocking)
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend/package-lock.json
          scanners: vuln
          trivyignores: .trivyignore.yaml
          severity: MEDIUM
          ignore-unfixed: false
          exit-code: '1'

      # --- Tier 2: report only (SARIF → Security tab, never blocks) ---------

      - name: Trivy — full report incl dev deps, LOW, secrets, misconfig (SARIF)
        continue-on-error: true
        timeout-minutes: 10
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif
          skip-dirs: frontend/node_modules,.samples

      - name: Upload Trivy SARIF to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # osv-scanner includes dev deps by default and uses the OSV DB (no npm
      # registry needed). Report-only; complements Trivy.
      - name: osv-scanner (npm + Go lockfiles, report only)
        continue-on-error: true
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
          osv-scanner --lockfile=frontend/package-lock.json --lockfile=go.mod

      # Behavioural lockfile checks (non-registry sources, integrity, drift).
      # node_modules is absent here, so the installed-tree hook scan self-skips.
      - name: Behavioural supply-chain scan (lockfile)
        continue-on-error: true
        run: ./scripts/npm-supply-chain-scan.sh

  # ---------------------------------------------------------------------------
  # Functional Tests — Postgres-backed (-tags functional)
  #
  # These exercise real SQL against a throwaway Postgres and never ran in CI
  # before, so datastore/materialisation bugs (e.g. list-vs-summary drift) only
  # showed up in production. The test harness applies all migrations itself
  # (MigrateUp), so the job just needs an empty database.
  # ---------------------------------------------------------------------------
  functional:
    name: Functional Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmm
          POSTGRES_PASSWORD: cmm
          POSTGRES_DB: cmm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmm -d cmm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CMM_TEST_DATABASE_URL: postgres://cmm:cmm@localhost:5432/cmm_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Create placeholder frontend dist (for go:embed)
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html><head><title>placeholder</title></head><body></body></html>' > frontend/dist/index.html

      - name: Run functional tests (migrations auto-applied by the harness)
        run: go test -race -tags functional -run 'TestFunctional' ./...
