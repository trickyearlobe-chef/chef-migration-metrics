# Trivy ignore list.
#
# Every entry here is a decision to ship a known vulnerability, so every entry
# carries why it is acceptable and a date by which somebody has to look again.
# An ignore without an expiry is how a temporary exception becomes permanent.
#
# Wired in explicitly via the `trivyignores` input on each Trivy step in
# .github/workflows/{ci,release}.yml and via --ignorefile in the Makefile's
# trivy-npm target, so a local scan and CI agree about what is being waived.

