# golangci-lint v2 configuration
# https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  exclusions:
    paths:
      # Vendored JS dependencies ship sample/port .go files (e.g. flatted's Go
      # port under frontend/node_modules) that are not our source and must not
      # be linted.
      - frontend/node_modules
    rules:
      # QF* are staticcheck's optional "quickfix" style suggestions (e.g. prefer
      # a tagged switch, merge an assignment into a declaration). They are
      # stylistic, not correctness issues; rewriting established handler
      # conditionals for them adds risk without functional benefit, so the QF
      # category is excluded project-wide. Substantive staticcheck checks
      # (SA*, S1*) remain enabled.
      - linters:
          - staticcheck
        text: "QF[0-9]+"
  settings:
    errcheck:
      # Exclude fire-and-forget patterns where checking the return value
      # adds noise without improving correctness:
      #  - Logging methods (ScopedLogger) — if logging fails we can't log the failure
      #  - fmt.Fprint/Fprintf/Fprintln to http.ResponseWriter — errors surface as broken connections
      #  - (*os.File).Close in defers — nothing useful to do on failure
      #  - (*database/sql.Rows).Close in defers — already handled by Err()
      #  - (*database/sql.Stmt).Close in defers
      #  - os.Remove/os.RemoveAll in cleanup paths
      #  - (*net.Conn).Close / websocket close in defers
      exclude-functions:
        - (*github.com/trickyearlobe-chef/chef-migration-metrics/internal/logging.ScopedLogger).Debug
        - (*github.com/trickyearlobe-chef/chef-migration-metrics/internal/logging.ScopedLogger).Info
        - (*github.com/trickyearlobe-chef/chef-migration-metrics/internal/logging.ScopedLogger).Warn
        - (*github.com/trickyearlobe-chef/chef-migration-metrics/internal/logging.ScopedLogger).Error
        - (*github.com/trickyearlobe-chef/chef-migration-metrics/internal/logging.Logger).Debug
        - (*github.com/trickyearlobe-chef/chef-migration-metrics/internal/logging.Logger).Info
        - (*github.com/trickyearlobe-chef/chef-migration-metrics/internal/logging.Logger).Warn
        - (*github.com/trickyearlobe-chef/chef-migration-metrics/internal/logging.Logger).Error
        - fmt.Fprintf
        - fmt.Fprint
        - fmt.Fprintln
        - (net/http.ResponseWriter).Write
        - (*os.File).Close
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.DB).Close
        - os.Remove
        - os.RemoveAll
        - os.Unsetenv
        - os.Mkdir
        - os.MkdirAll
        - os.WriteFile
        - (*io.ReadCloser).Close
        - (io.ReadCloser).Close
        - (*net.Listener).Close
        - (net.Listener).Close
        - (*encoding/json.Encoder).Encode
        - (*github.com/coder/websocket.Conn).Close
